<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#eef4fa"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="My Chat"
    >

    <title>My Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">

            <div class="profile">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    ?
                </div>

                <div class="profile-info">

                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Загрузка...
                    </div>

                    <div class="profile-status">
                        Мой профиль
                    </div>

                </div>

                <button
                    class="close-button"
                    id="closeSidebar"
                    type="button"
                >
                    ×
                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Найти по нику"
                    autocomplete="off"
                >

            </div>

        </div>


        <!-- USERS -->

        <div class="users-title">
            Пользователи
        </div>


        <div
            class="user-list"
            id="userList"
        >

            <div class="empty-users">
                Никого пока нет
            </div>

        </div>

    </aside>


    <!-- OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- =========================================
         MAIN CHAT
    ========================================== -->

    <main class="chat">

        <!-- HEADER -->

        <header
            class="chat-header glass"
        >

            <button
                class="header-button"
                id="openSidebar"
                type="button"
            >
                ☰
            </button>


            <div
                class="header-avatar"
                id="headerAvatar"
            >
                ?
            </div>


            <div class="header-info">

                <div
                    class="header-name"
                    id="headerName"
                >
                    Выберите пользователя
                </div>

                <div
                    class="header-status"
                    id="status"
                >
                    Найдите человека по нику
                </div>

            </div>


            <button
                class="header-button"
                type="button"
                id="headerSearchButton"
            >
                ⌕
            </button>

        </header>


        <!-- =====================================
             EMPTY SCREEN
        ====================================== -->

        <section
            class="empty-screen"
            id="emptyScreen"
        >

            <div class="empty-icon">
                ✈
            </div>

            <div class="empty-title">
                Личные сообщения
            </div>

            <div class="empty-text">
                Найдите пользователя по нику,
                чтобы начать переписку.
            </div>

            <button
                class="find-button"
                id="findButton"
                type="button"
            >
                Найти пользователя
            </button>

        </section>


        <!-- =====================================
             MESSAGES
        ====================================== -->

        <section
            class="messages hidden"
            id="messages"
        ></section>


        <!-- =====================================
             EMOJI
        ====================================== -->

        <div
            class="emoji-panel glass"
            id="emojiPanel"
        >

            <button type="button">😀</button>
            <button type="button">😂</button>
            <button type="button">🤣</button>
            <button type="button">😊</button>
            <button type="button">😍</button>
            <button type="button">😎</button>
            <button type="button">👍</button>
            <button type="button">❤️</button>
            <button type="button">🔥</button>
            <button type="button">🎉</button>
            <button type="button">🤔</button>
            <button type="button">😭</button>
            <button type="button">💀</button>
            <button type="button">😡</button>
            <button type="button">🚀</button>
            <button type="button">✨</button>
            <button type="button">🥶</button>
            <button type="button">😴</button>
            <button type="button">😳</button>
            <button type="button">🤯</button>
            <button type="button">👏</button>
            <button type="button">💯</button>
            <button type="button">✅</button>
            <button type="button">❤️‍🔥</button>

        </div>


        <!-- =====================================
             COMPOSER
        ====================================== -->

        <form
            class="composer glass hidden"
            id="messageForm"
        >

            <button
                class="composer-button"
                id="emojiButton"
                type="button"
                aria-label="Эмодзи"
            >
                ☺
            </button>


            <input
                id="messageInput"
                type="text"
                maxlength="4000"
                autocomplete="off"
                placeholder="Сообщение"
            >


            <button
                class="composer-button attachment-button"
                type="button"
                aria-label="Вложения"
            >
                📎
            </button>


            <button
                class="send-button"
                type="submit"
                aria-label="Отправить"
            >
                ↑
            </button>

        </form>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
