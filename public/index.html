<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="title">My Chat</div>
            <div id="status" class="status">
                Подключение...
            </div>
        </div>
    </header>

    <main id="messages" class="messages"></main>

    <form id="messageForm" class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Написать сообщение..."
            maxlength="1000"
            autocomplete="off"
        >

        <button type="submit">
            Отправить
        </button>

    </form>

</div>

<script src="app.js"></script>

</body>
</html>
