<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>My Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <button
                class="icon-button mobile-only"
                id="closeSidebar"
                aria-label="Закрыть меню"
            >
                ☰
            </button>

            <div class="brand">

                <div class="brand-icon">
                    ✈
                </div>

                <div>

                    <div class="brand-title">
                        My Chat
                    </div>

                    <div class="brand-subtitle">
                        Мессенджер
                    </div>

                </div>

            </div>

        </div>


        <!-- ПОИСК -->

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Поиск"
                autocomplete="off"
            >

        </div>


        <!-- СПИСОК ЧАТОВ -->

        <div class="chat-list">

            <button
                class="chat-item active"
                id="chatItem"
            >

                <div class="avatar">
                    C
                </div>

                <div class="chat-info">

                    <div class="chat-top">

                        <span class="chat-name">
                            Общий чат
                        </span>

                        <span
                            class="chat-time"
                            id="lastTime"
                        ></span>

                    </div>

                    <div
                        class="chat-preview"
                        id="chatPreview"
                    >
                        Пока сообщений нет
                    </div>

                </div>

            </button>

        </div>

    </aside>


    <!-- Затемнение мобильного меню -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- =========================
         CHAT
    ========================== -->

    <main class="chat">

        <!-- HEADER -->

        <header class="chat-header">

            <button
                class="icon-button mobile-only"
                id="openSidebar"
                aria-label="Открыть меню"
            >
                ☰
            </button>


            <div class="header-avatar">
                C
            </div>


            <div class="header-info">

                <div class="header-name">
                    Общий чат
                </div>

                <div
                    id="status"
                    class="header-status"
                >
                    Подключение...
                </div>

            </div>


            <div class="header-actions">

                <button
                    class="icon-button"
                    title="Поиск"
                >
                    ⌕
                </button>

                <button
                    class="icon-button"
                    title="Ещё"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- СООБЩЕНИЯ -->

        <section
            id="messages"
            class="messages"
            aria-live="polite"
        ></section>


        <!-- =========================
             EMOJI
        ========================== -->

        <div
            class="emoji-panel"
            id="emojiPanel"
        >

            <button type="button">😀</button>
            <button type="button">😂</button>
            <button type="button">🤣</button>
            <button type="button">😊</button>
            <button type="button">😍</button>
            <button type="button">😎</button>
            <button type="button">👍</button>
            <button type="button">❤️</button>
            <button type="button">🔥</button>
            <button type="button">🎉</button>
            <button type="button">🤔</button>
            <button type="button">😭</button>
            <button type="button">💀</button>
            <button type="button">😡</button>
            <button type="button">🚀</button>
            <button type="button">✨</button>

        </div>


        <!-- =========================
             INPUT
        ========================== -->

        <form
            id="messageForm"
            class="composer"
        >

            <button
                type="button"
                class="composer-button"
                id="emojiButton"
                title="Эмодзи"
            >
                ☺
            </button>


            <input
                id="messageInput"
                type="text"
                placeholder="Сообщение"
                maxlength="1000"
                autocomplete="off"
            >


            <button
                type="button"
                class="composer-button attachment-button"
                title="Прикрепить файл"
            >
                📎
            </button>


            <button
                type="submit"
                class="send-button"
                aria-label="Отправить"
                title="Отправить"
            >
                ➤
            </button>

        </form>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
