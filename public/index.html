<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f4f7fb">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="My Chat"
    >

    <title>My Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- МОБИЛЬНОЕ МЕНЮ -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">

            <div class="profile">

                <div class="profile-avatar">
                    C
                </div>

                <div class="profile-info">

                    <div class="profile-name">
                        My Chat
                    </div>

                    <div class="profile-status">
                        Онлайн
                    </div>

                </div>

                <button
                    class="glass-button"
                    id="closeSidebar"
                    type="button"
                    aria-label="Закрыть"
                >
                    ×
                </button>

            </div>


            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Поиск"
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="chat-list">

            <button
                class="chat-item active"
                id="chatItem"
                type="button"
            >

                <div class="avatar">
                    C
                </div>

                <div class="chat-info">

                    <div class="chat-top">

                        <span class="chat-name">
                            Общий чат
                        </span>

                        <span
                            class="chat-time"
                            id="lastTime"
                        ></span>

                    </div>

                    <div
                        class="chat-preview"
                        id="chatPreview"
                    >
                        Пока сообщений нет
                    </div>

                </div>

            </button>

        </div>

    </aside>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ОСНОВНОЙ ЭКРАН -->

    <main class="chat">

        <!-- HEADER -->

        <header class="chat-header glass">

            <button
                class="header-button"
                id="openSidebar"
                type="button"
                aria-label="Открыть чаты"
            >
                ☰
            </button>


            <div class="header-avatar">
                C
            </div>


            <div class="header-info">

                <div class="header-name">
                    Общий чат
                </div>

                <div
                    class="header-status"
                    id="status"
                >
                    Подключение...
                </div>

            </div>


            <button
                class="header-button"
                type="button"
                aria-label="Поиск"
            >
                ⌕
            </button>

        </header>


        <!-- СООБЩЕНИЯ -->

        <section
            class="messages"
            id="messages"
        ></section>


        <!-- EMOJI -->

        <div
            class="emoji-panel glass"
            id="emojiPanel"
        >

            <button type="button">😀</button>
            <button type="button">😂</button>
            <button type="button">🤣</button>
            <button type="button">😊</button>
            <button type="button">😍</button>
            <button type="button">😎</button>
            <button type="button">👍</button>
            <button type="button">❤️</button>
            <button type="button">🔥</button>
            <button type="button">🎉</button>
            <button type="button">🤔</button>
            <button type="button">😭</button>
            <button type="button">💀</button>
            <button type="button">😡</button>
            <button type="button">🚀</button>
            <button type="button">✨</button>
            <button type="button">🥶</button>
            <button type="button">😴</button>
            <button type="button">😳</button>
            <button type="button">🤯</button>
            <button type="button">👏</button>
            <button type="button">💯</button>
            <button type="button">❤️‍🔥</button>
            <button type="button">✅</button>

        </div>


        <!-- НИЖНЯЯ ПАНЕЛЬ -->

        <form
            class="composer glass"
            id="messageForm"
        >

            <button
                class="composer-button"
                id="emojiButton"
                type="button"
                aria-label="Эмодзи"
            >
                ☺
            </button>


            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                autocomplete="off"
                placeholder="Сообщение"
            >


            <button
                class="composer-button"
                type="button"
                aria-label="Вложения"
            >
                📎
            </button>


            <button
                class="send-button"
                type="submit"
                aria-label="Отправить"
            >
                ↑
            </button>

        </form>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
